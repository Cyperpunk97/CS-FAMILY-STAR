<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="sugoBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </radialGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="40%" stop-color="#EA580C"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <filter id="sugoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Badge -->
  <rect x="14" y="14" width="212" height="212" rx="36" fill="url(#sugoBg)" stroke="#F59E0B" stroke-width="3"/>
  <rect x="22" y="22" width="196" height="196" rx="30" fill="none" stroke="#FDE68A" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Flame & Sizzle Skillet Motif -->
  <g filter="url(#sugoShadow)">
    <!-- Fire Flame -->
    <path d="M120 42 C126 55, 138 64, 138 78 C138 90, 128 98, 120 98 C112 98, 102 90, 102 78 C102 64, 114 55, 120 42 Z" fill="url(#flameGrad)"/>
    <path d="M120 62 C123 70, 130 75, 130 82 C130 88, 125 93, 120 93 C115 93, 110 88, 110 82 C110 75, 117 70, 120 62 Z" fill="#FEF08A"/>

    <!-- Sizzling Skillet / Street Pan Line -->
    <path d="M84 100 Q120 110 156 100" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="94" r="2.5" fill="#FDE68A"/>
    <circle cx="140" cy="92" r="2.5" fill="#FDE68A"/>
    <circle cx="120" cy="90" r="3" fill="#F59E0B"/>
  </g>

  <!-- Typography -->
  <g text-anchor="middle">
    <!-- English Wordmark -->
    <text x="120" y="146" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="4" filter="url(#sugoShadow)">
      SUGO
    </text>

    <!-- Arabic Calligraphy Text: سوجو -->
    <text x="120" y="180" font-family="'Cairo', 'Amiri', 'Segoe UI', Tahoma, sans-serif" 
          font-size="26" font-weight="800" fill="#FBBF24" letter-spacing="2">
      سوجو
    </text>

    <!-- Tagline -->
    <text x="120" y="206" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="8.5" font-weight="700" fill="#FECDD3" letter-spacing="2.5">
      STREET SIZZLE &amp; GRILL
    </text>
  </g>
</svg>
