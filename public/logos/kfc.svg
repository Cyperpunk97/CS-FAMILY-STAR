<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Drop Shadow for layered elements -->
    <filter id="kfcShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect x="8" y="8" width="224" height="224" rx="42" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Iconic KFC Red & White Vertical Stripes (Bucket Motif) -->
  <clipPath id="innerClip">
    <rect x="12" y="12" width="216" height="216" rx="38"/>
  </clipPath>

  <g clip-path="url(#innerClip)">
    <!-- Base Red Background -->
    <rect x="12" y="12" width="216" height="216" fill="#A3080C"/>

    <!-- Left Red Stripe (matches KFC bucket: Red / White / Red) -->
    <!-- White Center Panel -->
    <rect x="68" y="12" width="104" height="216" fill="#FFFFFF"/>
    <!-- Red outer side stripes are already the base red -->
    <rect x="12" y="12" width="56" height="216" fill="#A3080C"/>
    <rect x="172" y="12" width="56" height="216" fill="#A3080C"/>

    <!-- Colonel Sanders Icon Silhouette in White Center -->
    <g transform="translate(120, 84)" filter="url(#kfcShadow)">
      <!-- Face contour & hair -->
      <!-- White Hair & Brow -->
      <path d="M-28 -34 C-34 -14 -32 4 -28 14 C-24 24 -14 36 0 38 C14 36 24 24 28 14 C32 4 34 -14 28 -34 C20 -44 -20 -44 -28 -34 Z" fill="#000000"/>
      <!-- Inner white face -->
      <path d="M-24 -24 C-28 -8 -26 4 -22 14 C-18 22 -10 32 0 34 C10 32 18 22 22 14 C26 4 28 -8 24 -24 C18 -34 -18 -34 -24 -24 Z" fill="#FFFFFF"/>

      <!-- Glasses -->
      <rect x="-22" y="-14" width="16" height="12" rx="3" fill="#000000"/>
      <rect x="6" y="-14" width="16" height="12" rx="3" fill="#000000"/>
      <rect x="-19" y="-12" width="10" height="8" rx="2" fill="#FFFFFF"/>
      <rect x="9" y="-12" width="10" height="8" rx="2" fill="#FFFFFF"/>
      <line x1="-6" y1="-8" x2="6" y2="-8" stroke="#000000" stroke-width="2.5"/>

      <!-- Eyes -->
      <circle cx="-14" cy="-8" r="2" fill="#000000"/>
      <circle cx="14" cy="-8" r="2" fill="#000000"/>

      <!-- Smile lines -->
      <path d="M-6 2 Q0 6 6 2" stroke="#000000" stroke-width="1.8" fill="none" stroke-linecap="round"/>

      <!-- Classic White Goatee / Mustache -->
      <!-- Mustache -->
      <path d="M-18 8 Q-10 14 0 10 Q10 14 18 8 Q10 18 0 14 Q-10 18 -18 8 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
      <!-- Beard/Goatee -->
      <path d="M-10 15 Q0 28 10 15 Q6 32 0 34 Q-6 32 -10 15 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>

      <!-- String Bowtie -->
      <path d="M-14 36 L14 36 L10 42 L-10 42 Z" fill="#000000"/>
      <path d="M-6 42 L-12 56 L-3 53 L-4 42 Z" fill="#000000"/>
      <path d="M6 42 L12 56 L3 53 L4 42 Z" fill="#000000"/>
    </g>

    <!-- Bold Red KFC Wordmark on White Ground -->
    <g transform="translate(120, 192)" text-anchor="middle" filter="url(#kfcShadow)">
      <!-- Drop subtle background pill for contrast against stripes -->
      <rect x="-72" y="-34" width="144" height="42" rx="8" fill="#A3080C"/>
      <text x="0" y="-4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Impact', 'Segoe UI Black', Arial Black, sans-serif" 
            font-size="34" font-weight="900" fill="#FFFFFF" font-style="italic" letter-spacing="3">
        KFC
      </text>
    </g>
  </g>
</svg>
