<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="pastaBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </radialGradient>
    <linearGradient id="pastaNoodle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="120" cy="120" r="110" fill="url(#pastaBg)" stroke="#F59E0B" stroke-width="4"/>
  <circle cx="120" cy="120" r="102" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Pasta Fork & Swirl Group -->
  <g filter="url(#subtleShadow)">
    <!-- Fork stem -->
    <path d="M120 40 L120 78" stroke="#F1F5F9" stroke-width="5" stroke-linecap="round"/>
    <path d="M112 40 L112 72" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <path d="M128 40 L128 72" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Swirled Pasta Ribbon around fork -->
    <path d="M96 68 C110 58, 134 56, 146 66 C156 74, 148 86, 132 88 C108 90, 88 78, 92 98 C96 112, 126 110, 148 102 C154 99, 158 103, 154 108 C144 122, 102 124, 88 110 C80 102, 82 86, 96 78" 
          fill="none" stroke="url(#pastaNoodle)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Fresh Basil Leaf Accent -->
    <path d="M142 62 C146 54, 156 52, 160 56 C162 64, 154 70, 146 68 Z" fill="#22C55E"/>
    <path d="M144 63 Q152 61 156 58" stroke="#15803D" stroke-width="1" fill="none"/>
  </g>

  <!-- Brand Typography -->
  <g text-anchor="middle">
    <!-- PASTA wordmark -->
    <text x="120" y="152" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="3" filter="url(#subtleShadow)">
      PASTA
    </text>
    
    <!-- 2GO Red & Gold Pill Container -->
    <rect x="74" y="166" width="92" height="34" rx="17" fill="#FACC15" filter="url(#subtleShadow)"/>
    <text x="120" y="190" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="22" font-weight="900" fill="#991B1B" letter-spacing="2">
      2GO
    </text>
    
    <!-- Subtitle banner -->
    <text x="120" y="216" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="9" font-weight="700" fill="#FEF08A" letter-spacing="3">
      FRESH &amp; FAST CUPS
    </text>
  </g>
</svg>
